name: Manage Azure POC

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform on the POC VM
        required: true
        type: choice
        default: start
        options:
          - start
          - stop
          - status
  schedule:
    # Primary end-of-day shutdown. The timezone follows CET/CEST automatically.
    - cron: "7 18 * * *"
      timezone: Europe/Stockholm
    # A later safety pass catches a delayed/dropped primary run or a VM restarted after 18:00.
    - cron: "37 23 * * *"
      timezone: Europe/Stockholm

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-poc
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    environment: poc
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_DNS_LABEL: ${{ vars.AZURE_DNS_LABEL }}
      PUBLIC_URL: https://${{ vars.AZURE_DNS_LABEL }}.${{ vars.AZURE_LOCATION }}.cloudapp.azure.com
      UI_PUBLIC_URL: https://${{ vars.AZURE_UI_DNS_LABEL }}.${{ vars.AZURE_LOCATION }}.cloudapp.azure.com
      REQUESTED_ACTION: ${{ github.event_name == 'schedule' && 'stop' || inputs.action }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start, stop, or inspect the POC VM
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?Missing AZURE_RESOURCE_GROUP}"
          : "${AZURE_DNS_LABEL:?Missing AZURE_DNS_LABEL}"
          : "${REQUESTED_ACTION:?Missing action}"

          vm_name="${AZURE_DNS_LABEL}-vm"
          if ! az vm show --resource-group "$AZURE_RESOURCE_GROUP" --name "$vm_name" --output none 2>/dev/null; then
            echo "POC VM $vm_name does not exist; nothing to manage." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          power_state() {
            az vm get-instance-view \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$vm_name" \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" \
              --output tsv
          }

          before=$(power_state)
          case "$REQUESTED_ACTION" in
            start)
              if [[ "$before" != 'VM running' ]]; then
                az vm start --resource-group "$AZURE_RESOURCE_GROUP" --name "$vm_name" --output none
              fi

              curl \
                --fail \
                --show-error \
                --silent \
                --retry 60 \
                --retry-delay 5 \
                --retry-all-errors \
                --max-time 10 \
                "$PUBLIC_URL/health" >/dev/null

              headers=$(mktemp)
              curl \
                --show-error \
                --silent \
                --retry 30 \
                --retry-delay 5 \
                --retry-all-errors \
                --max-time 10 \
                --output /dev/null \
                --dump-header "$headers" \
                "$UI_PUBLIC_URL/ui"
              grep --ignore-case --extended-regexp '^location: https://login\.microsoftonline\.com/' "$headers"
              ;;
            stop)
              if [[ "$before" != 'VM deallocated' ]]; then
                az vm deallocate --resource-group "$AZURE_RESOURCE_GROUP" --name "$vm_name" --output none
              fi
              ;;
            status)
              ;;
            *)
              echo "Unsupported action: $REQUESTED_ACTION" >&2
              exit 2
              ;;
          esac

          after=$(power_state)
          {
            echo '## Azure POC management'
            echo
            echo "- Requested action: $REQUESTED_ACTION"
            echo "- VM: $vm_name"
            echo "- Before: $before"
            echo "- After: $after"
            if [[ "$REQUESTED_ACTION" == 'start' ]]; then
              echo "- Open WebUI: $PUBLIC_URL"
              echo "- Agentgateway UI: $UI_PUBLIC_URL/ui"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
