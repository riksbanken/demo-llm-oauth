name: Manage Azure POC

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform on the POC VM
        required: true
        type: choice
        default: start
        options:
          - start
          - stop
          - status
  schedule:
    # Primary end-of-day shutdown. The timezone follows CET/CEST automatically.
    - cron: "7 18 * * *"
      timezone: Europe/Stockholm
    # A later safety pass catches a delayed/dropped primary run or a VM restarted after 18:00.
    - cron: "37 23 * * *"
      timezone: Europe/Stockholm

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: azure-poc
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    environment: poc
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_DNS_LABEL: ${{ vars.AZURE_DNS_LABEL }}
      PUBLIC_URL: https://${{ vars.AZURE_DNS_LABEL }}.${{ vars.AZURE_LOCATION }}.cloudapp.azure.com
      UI_PUBLIC_URL: https://${{ vars.AZURE_UI_DNS_LABEL }}.${{ vars.AZURE_LOCATION }}.cloudapp.azure.com
      REQUESTED_ACTION: ${{ github.event_name == 'schedule' && 'stop' || inputs.action }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start, stop, or inspect the POC runtime
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?Missing AZURE_RESOURCE_GROUP}"
          : "${AZURE_DNS_LABEL:?Missing AZURE_DNS_LABEL}"
          : "${REQUESTED_ACTION:?Missing action}"

          vm_name="${AZURE_DNS_LABEL}-vm"
          load_balancer_name="${AZURE_DNS_LABEL}-lb"

          vm_exists=false
          if az vm show --resource-group "$AZURE_RESOURCE_GROUP" --name "$vm_name" --output none 2>/dev/null; then
            vm_exists=true
          fi

          load_balancer_exists=false
          if az network lb show --resource-group "$AZURE_RESOURCE_GROUP" --name "$load_balancer_name" --output none 2>/dev/null; then
            load_balancer_exists=true
          fi

          power_state() {
            if [[ "$vm_exists" != true ]]; then
              printf 'VM absent\n'
              return
            fi
            az vm get-instance-view \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$vm_name" \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]" \
              --output tsv
          }

          before=$(power_state)
          case "$REQUESTED_ACTION" in
            start)
              gh workflow run deploy-azure-poc.yml --ref main
              {
                echo '## Azure POC management'
                echo
                echo '- Requested action: start'
                echo '- Full deployment workflow dispatched.'
                echo '- It will recreate the Load Balancer, start the VM, and verify both endpoints.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            stop)
              if [[ "$vm_exists" == true && "$before" != 'VM deallocated' ]]; then
                az vm deallocate --resource-group "$AZURE_RESOURCE_GROUP" --name "$vm_name" --output none
              fi
              if [[ "$load_balancer_exists" == true ]]; then
                az network lb delete \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$load_balancer_name"
                load_balancer_exists=false
              fi
              ;;
            status)
              ;;
            *)
              echo "Unsupported action: $REQUESTED_ACTION" >&2
              exit 2
              ;;
          esac

          after=$(power_state)
          if az network lb show --resource-group "$AZURE_RESOURCE_GROUP" --name "$load_balancer_name" --output none 2>/dev/null; then
            load_balancer_status='present'
          else
            load_balancer_status='absent'
          fi

          {
            echo '## Azure POC management'
            echo
            echo "- Requested action: $REQUESTED_ACTION"
            echo "- VM: $vm_name"
            echo "- Before: $before"
            echo "- After: $after"
            echo "- Load Balancer: $load_balancer_status"
            echo '- Retained: resource group/RBAC, Entra applications and consent, public IP hostnames, Key Vault, Azure OpenAI, VNet, NSG, VM disk.'
          } >> "$GITHUB_STEP_SUMMARY"
