services:
  openwebui:
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      openwebui:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddy
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

configs:
  caddy:
    content: |
      ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME to the public DNS hostname} {
        encode zstd gzip
        reverse_proxy openwebui:8080
      }

volumes:
  caddy-data:
  caddy-config:
