services:
  agentgateway:
    environment:
      OIDC_COOKIE_SECRET: "${AGENTGATEWAY_UI_COOKIE_SECRET:?Set AGENTGATEWAY_UI_COOKIE_SECRET}"
    volumes:
      - "${AGENTGATEWAY_DATA_DIR:?Set AGENTGATEWAY_DATA_DIR}:/data"

  openwebui:
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      openwebui:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddy
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  caddy-ui:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      - agentgateway
    ports:
      - "8081:80"
      - "8443:443"
    configs:
      - source: caddy-ui
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-ui-data:/data
      - caddy-ui-config:/config

configs:
  agentgateway:
    content: |
      config:
        database:
          url: "sqlite:///data/agentgateway.db"
          maxConnections: 5
        storage:
          mode: readOnly
      frontendPolicies:
        accessLog:
          database:
            llm: metadata
      gateways:
        ui:
          port: 4001
      llm:
        port: 4000
        policies:
          jwtAuth:
            mode: strict
            issuer: "https://login.microsoftonline.com/${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID}/v2.0"
            audiences:
              - "${GATEWAY_APP_ID:?Set GATEWAY_APP_ID}"
            jwks:
              url: "https://login.microsoftonline.com/${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID}/discovery/v2.0/keys"
          authorization:
            rules:
              - allow: 'has(jwt.scp) && "llm.invoke" in jwt.scp.split(" ")'
        models:
          - name: llm
            provider: "${UPSTREAM_PROVIDER:?Set UPSTREAM_PROVIDER}"
            requestHeaders:
              remove: [cookie]
            params:
              model: "${UPSTREAM_MODEL:?Set UPSTREAM_MODEL}"
              baseUrl: "${UPSTREAM_BASE_URL:?Set UPSTREAM_BASE_URL}"
              apiKey: "${UPSTREAM_API_KEY:?Set UPSTREAM_API_KEY}"
              azureResourceName: "${AZURE_RESOURCE_NAME:-}"
              azureResourceType: "${AZURE_RESOURCE_TYPE:-openAI}"
              azureApiVersion: "${AZURE_API_VERSION:-}"
      ui:
        gateways:
          - ui
        policies:
          oidc:
            issuer: "https://login.microsoftonline.com/${ENTRA_TENANT_ID:?Set ENTRA_TENANT_ID}/v2.0"
            clientId: "${AGENTGATEWAY_UI_CLIENT_ID:?Set AGENTGATEWAY_UI_CLIENT_ID}"
            clientSecret: "${AGENTGATEWAY_UI_CLIENT_SECRET:?Set AGENTGATEWAY_UI_CLIENT_SECRET}"
            redirectURI: "https://${AGENTGATEWAY_UI_HOSTNAME:?Set AGENTGATEWAY_UI_HOSTNAME}/oauth/callback"
            scopes:
              - profile
              - email

  caddy:
    content: |
      ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME to the public DNS hostname} {
        encode zstd gzip
        reverse_proxy openwebui:8080
      }

  caddy-ui:
    content: |
      ${AGENTGATEWAY_UI_HOSTNAME:?Set AGENTGATEWAY_UI_HOSTNAME} {
        encode zstd gzip
        reverse_proxy agentgateway:4001
      }

volumes:
  caddy-data:
  caddy-config:
  caddy-ui-data:
  caddy-ui-config:
