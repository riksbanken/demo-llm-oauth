#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - unattended-upgrades
  - python3
  - tar
  - gzip

timezone: Etc/UTC
ssh_pwauth: false

write_files:
  - path: /etc/ssh/sshd_config.d/01-llm-oauth.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {"log-driver":"local","log-opts":{"max-size":"10m","max-file":"3"}}

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl --fail --show-error --silent --location https://download.docker.com/linux/ubuntu/gpg --output /tmp/docker.asc
  - gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /tmp/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - rm -f /tmp/docker.asc
  - >-
    bash -lc '. /etc/os-release; printf "%s\n"
    "deb [arch=$(dpkg --print-architecture)
    signed-by=/etc/apt/keyrings/docker.gpg]
    https://download.docker.com/linux/ubuntu
    $VERSION_CODENAME stable"
    > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - install -d -o root -g root -m 0750 /opt/llm-oauth/releases
  - sshd -t
  - systemctl restart ssh
